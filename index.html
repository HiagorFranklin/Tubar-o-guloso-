<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8fd3e8">
<meta name="description" content="Cuide do tubarão de pelúcia: dê comida, banho, coloque para dormir e jogue Pega-peixe.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Tubarão Guloso 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: casinha submarina 3D em tela cheia; topo com nome, moedas e 4 necessidades; base com bandeja do cômodo e navegação estilo Pou */
:root{
  --ink:#15304d;
  --ink-soft:#4d6680;
  --card:rgba(255,255,255,.9);
  --card-line:rgba(21,48,77,.12);
  --coral:#ff5d6c;
  --coral-dark:#c23446;
  --gold:#ffc93c;
  --fome:#ff9a3c;
  --diversao:#a46bff;
  --limpeza:#2fb3dd;
  --energia:#f5b700;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
p,h2,ul{margin:0}
html,body{height:100%}
body{
  margin:0;font-size:14px;-webkit-text-size-adjust:100%;
  background:#8fd3e8;color:var(--ink);font-family:var(--body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--coral);outline-offset:2px}

.top{
  position:fixed;top:0;left:0;right:0;z-index:5;display:flex;flex-direction:column;gap:8px;pointer-events:none;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.idcard{pointer-events:auto;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--card-line);border-radius:16px;padding:6px 14px 7px;min-width:0;box-shadow:0 3px 0 rgba(21,48,77,.12)}
.name{font:400 1.3rem var(--display);background:none;border:0;padding:0;text-align:left;line-height:1.1;max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#nameInput{font:400 1.2rem var(--display);color:var(--ink);border:2px solid var(--coral);border-radius:8px;padding:2px 6px;width:44vw;max-width:220px;background:#fff}
.sub{font-size:.75rem;color:var(--ink-soft);font-weight:800;font-variant-numeric:tabular-nums}
.right{display:flex;gap:8px;align-items:center;pointer-events:auto}
.coins{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--card-line);border-radius:999px;padding:6px 14px 6px 8px;box-shadow:0 3px 0 rgba(21,48,77,.12)}
.coins b{font:400 1.2rem var(--display);font-variant-numeric:tabular-nums}
.coins svg{width:24px;height:24px}
.round{width:40px;height:40px;border-radius:50%;border:1px solid var(--card-line);background:var(--card);display:grid;place-items:center;box-shadow:0 3px 0 rgba(21,48,77,.12)}
.round svg{width:20px;height:20px;fill:var(--ink)}
.needs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;max-width:520px;width:100%;margin:0 auto;pointer-events:none}
.need{background:var(--card);border:1px solid var(--card-line);border-radius:14px;padding:6px 8px;display:flex;flex-direction:column;gap:4px;min-width:0;box-shadow:0 3px 0 rgba(21,48,77,.1)}
.need .lab{display:flex;align-items:center;gap:5px;font-size:.66rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);white-space:nowrap;overflow:hidden}
.need svg{width:15px;height:15px;flex:none}
.bar{height:8px;border-radius:4px;background:rgba(21,48,77,.1);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;transition:width .4s ease}
.need.low{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{background:#ffe0e3}}

.bubble{
  position:fixed;z-index:4;transform:translate(-50%,-100%);pointer-events:none;
  background:#fff;color:var(--ink);font-weight:900;font-size:1rem;padding:9px 14px;border-radius:16px;white-space:nowrap;
  box-shadow:0 4px 0 rgba(21,48,77,.15);
}
.bubble::after{content:"";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);border:8px solid transparent;border-bottom:0;border-top-color:#fff}
.zzz{position:fixed;z-index:4;pointer-events:none;font:400 1.4rem var(--display);color:#fff;text-shadow:0 2px 0 rgba(21,48,77,.4);animation:zz 2.4s ease-out forwards}
@keyframes zz{0%{opacity:0;transform:translate(0,0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(34px,-80px) scale(1.3)}}

.bottom{
  position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px);
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
}
.tray{pointer-events:auto;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;max-width:560px;width:100%}
.food{flex:1 1 0;min-width:72px;max-width:120px;background:var(--card);border:1px solid var(--card-line);border-radius:16px;padding:8px 6px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 4px 0 rgba(21,48,77,.14);transition:transform .08s}
.food:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(21,48,77,.14)}
.food svg{width:40px;height:28px}
.food strong{font-size:.8rem;font-weight:900}
.food span{display:flex;align-items:center;gap:3px;font-size:.75rem;font-weight:900;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.food span svg{width:13px;height:13px}
.food[disabled]{opacity:.45}
.act{
  background:var(--card);border:1px solid var(--card-line);border-radius:16px;padding:12px 18px;font-weight:900;font-size:.98rem;
  display:inline-flex;align-items:center;gap:8px;box-shadow:0 4px 0 rgba(21,48,77,.14);
}
.act svg{width:20px;height:20px}
.act.primary{background:var(--coral);color:#fff;border-color:transparent;box-shadow:0 4px 0 var(--coral-dark);font:400 1.15rem var(--display);letter-spacing:.02em}
.act[aria-pressed="true"]{background:#dff5ff;border-color:var(--limpeza)}
.hint{width:100%;text-align:center;font-size:.82rem;font-weight:800;color:var(--ink);background:rgba(255,255,255,.65);border-radius:10px;padding:4px 10px}
.rooms{pointer-events:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;max-width:520px;background:var(--card);border:1px solid var(--card-line);border-radius:20px;padding:6px;box-shadow:0 4px 0 rgba(21,48,77,.14)}
.rooms button{border:0;background:transparent;border-radius:14px;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.74rem;font-weight:900;color:var(--ink-soft)}
.rooms svg{width:24px;height:24px;fill:currentColor}
.rooms button[aria-current="true"]{background:var(--ink);color:#fff}

.game-hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);z-index:6;display:flex;gap:10px;pointer-events:none}
.game-hud div{background:var(--card);border-radius:14px;padding:6px 16px;text-align:center;box-shadow:0 3px 0 rgba(21,48,77,.14)}
.game-hud span{display:block;font-size:.62rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.game-hud b{font:400 1.6rem var(--display);font-variant-numeric:tabular-nums}

.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(10,30,50,.35);padding:16px}
.card{width:min(360px,100%);background:#fff;border-radius:24px;padding:24px 20px 20px;display:flex;flex-direction:column;gap:12px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.card h2{font:400 2.2rem var(--display);color:var(--coral);line-height:1;text-wrap:balance}
.card p{font-weight:800;color:var(--ink-soft);line-height:1.4}
.card .big{font:400 3rem var(--display);color:var(--ink);line-height:1}
.card .btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

.toast{position:fixed;left:50%;top:42%;transform:translateX(-50%);z-index:15;background:var(--ink);color:#fff;font-weight:900;padding:10px 16px;border-radius:14px;max-width:calc(100% - 32px);text-align:center;animation:toast 2.6s ease forwards;pointer-events:none}
@keyframes toast{0%{opacity:0;transform:translate(-50%,8px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.idcard,.coins,.round,.need,.rooms,.food,.act:not(.primary),.game-hud div{-webkit-backdrop-filter:blur(10px) saturate(1.4);backdrop-filter:blur(10px) saturate(1.4)}
.rooms button{transition:background .15s,color .15s}
.rooms button[aria-current="true"] svg{transform:scale(1.12)}
.err{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font-weight:800}
@media (max-width:380px){.need .lab span{display:none}.need{padding:6px}}
@media (prefers-reduced-motion:reduce){.need.low,.zzz,.toast{animation:none}}
</style>
</head>
<body>


<canvas id="scene" aria-label="Casa 3D do tubarão"></canvas>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-fome" viewBox="0 0 24 24"><path d="M3 12c3-5 9-6 13-3l5-4v14l-5-4c-4 3-10 2-13-3z"/><circle cx="7.5" cy="11" r="1.3" fill="#fff"/></symbol>
    <symbol id="i-diversao" viewBox="0 0 24 24"><path d="M12 2l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17l-6.1 3.4 1.5-6.8L2.2 9l6.9-.7z"/></symbol>
    <symbol id="i-limpeza" viewBox="0 0 24 24"><path d="M12 2s7 7.6 7 12.5A7 7 0 0 1 5 14.5C5 9.6 12 2 12 2z"/></symbol>
    <symbol id="i-energia" viewBox="0 0 24 24"><path d="M14 2L4 14h7l-2 8 11-13h-7z"/></symbol>
    <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#ffc93c"/><circle cx="12" cy="12" r="7" fill="none" stroke="#d99a00" stroke-width="2"/><path d="M9 12.5c1.6-2.4 4.4-2.6 6-.8l1.5-1.2v4l-1.5-1.2c-1.6 1.6-4.4 1.4-6-.8z" fill="#d99a00"/></symbol>
    <symbol id="i-cozinha" viewBox="0 0 24 24"><path d="M4 11h16v2a6 6 0 0 1-6 6h-4a6 6 0 0 1-6-6zM2 10h20v1.5H2zM9 3c0 2 2 2 2 4M13 3c0 2 2 2 2 4" stroke="currentColor" stroke-width="1.6" fill="currentColor" stroke-linecap="round"/></symbol>
    <symbol id="i-banho" viewBox="0 0 24 24"><path d="M4 12h16v2a6 6 0 0 1-6 6h-4a6 6 0 0 1-6-6zM2 11h20v1.5H2zM6 11V5a2 2 0 0 1 4 0v.5"/><circle cx="12" cy="6" r="1.2"/><circle cx="15" cy="4" r="1"/><circle cx="16" cy="8" r="1.4"/></symbol>
    <symbol id="i-quarto" viewBox="0 0 24 24"><path d="M15 3a9 9 0 1 0 6 13A7 7 0 0 1 15 3z"/></symbol>
    <symbol id="i-jogos" viewBox="0 0 24 24"><path d="M7 7h10a5 5 0 0 1 4.8 6.4l-1.2 4a2.3 2.3 0 0 1-3.9.9L14.5 16h-5l-2.2 2.3a2.3 2.3 0 0 1-3.9-.9l-1.2-4A5 5 0 0 1 7 7z"/><path d="M7 10v4M5 12h4" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><circle cx="16" cy="11" r="1.2" fill="#fff"/><circle cx="18" cy="13.2" r="1.2" fill="#fff"/></symbol>
    <symbol id="i-som" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="1.8" fill="currentColor" stroke-linecap="round"/></symbol>
    <symbol id="i-instalar" viewBox="0 0 24 24"><path d="M12 3v11M7.5 9.5L12 14l4.5-4.5M5 17v2.5h14V17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-mudo" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  </defs>
</svg>

<div class="top" id="top">
  <div class="row">
    <div class="idcard">
      <button class="name" id="nameBtn" aria-label="Trocar o nome do tubarão">Tubarão</button>
      <input id="nameInput" maxlength="16" hidden aria-label="Nome do tubarão">
      <span class="sub" id="weight">95 kg · gordinho</span>
    </div>
    <div class="right">
      <div class="coins" aria-label="Moedas"><svg><use href="#i-coin"/></svg><b id="coins">60</b></div>
      <button class="round" id="installBtn" hidden aria-label="Colocar ícone na tela inicial"><svg style="fill:none;color:var(--ink)"><use href="#i-instalar"/></svg></button>
      <button class="round" id="muteBtn" aria-label="Desligar o som"><svg><use href="#i-som"/></svg></button>
    </div>
  </div>
  <div class="needs">
    <div class="need" id="n-fome"><div class="lab"><svg style="fill:var(--fome)"><use href="#i-fome"/></svg><span>Fome</span></div><div class="bar"><i style="background:var(--fome)"></i></div></div>
    <div class="need" id="n-diversao"><div class="lab"><svg style="fill:var(--diversao)"><use href="#i-diversao"/></svg><span>Diversão</span></div><div class="bar"><i style="background:var(--diversao)"></i></div></div>
    <div class="need" id="n-limpeza"><div class="lab"><svg style="fill:var(--limpeza)"><use href="#i-limpeza"/></svg><span>Limpeza</span></div><div class="bar"><i style="background:var(--limpeza)"></i></div></div>
    <div class="need" id="n-energia"><div class="lab"><svg style="fill:var(--energia)"><use href="#i-energia"/></svg><span>Energia</span></div><div class="bar"><i style="background:var(--energia)"></i></div></div>
  </div>
</div>

<div class="bubble" id="bubble" hidden></div>

<div class="bottom" id="bottom">
  <div class="tray" id="tray-cozinha"></div>
  <div class="tray" id="tray-banho" hidden>
    <p class="hint" id="bathHint">Esfregue o tubarão com o dedo e depois ligue o chuveiro</p>
    <button class="act" id="soapBtn" aria-pressed="true"><svg style="fill:var(--limpeza)"><use href="#i-limpeza"/></svg>Sabão</button>
    <button class="act primary" id="showerBtn">Chuveiro</button>
  </div>
  <div class="tray" id="tray-quarto" hidden>
    <button class="act primary" id="lightBtn">Apagar a luz</button>
  </div>
  <div class="tray" id="tray-jogos" hidden>
    <p class="hint" id="gameHint">Pega-peixe: arraste para pegar os peixes e fuja dos ouriços</p>
    <button class="act primary" id="playBtn">Jogar Pega-peixe</button>
  </div>
  <nav class="rooms" aria-label="Cômodos">
    <button data-room="cozinha" aria-current="true"><svg><use href="#i-cozinha"/></svg>Cozinha</button>
    <button data-room="banho"><svg><use href="#i-banho"/></svg>Banho</button>
    <button data-room="quarto"><svg><use href="#i-quarto"/></svg>Quarto</button>
    <button data-room="jogos"><svg><use href="#i-jogos"/></svg>Jogos</button>
  </nav>
</div>

<div class="game-hud" id="gameHud" hidden>
  <div><span>Tempo</span><b id="gTime">30</b></div>
  <div><span>Peixes</span><b id="gScore">0</b></div>
</div>

<div class="modal" id="gameOver" hidden>
  <div class="card">
    <h2>Fim do Pega-peixe</h2>
    <div class="big" id="goScore">0</div>
    <p id="goText">peixes pegos</p>
    <div class="btns"><button class="act" id="goExit">Sair</button><button class="act primary" id="goAgain">Jogar de novo</button></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
if (!window.THREE) { document.body.innerHTML = '<p class="err">Não foi possível carregar o 3D. Recarregue a página.</p>'; return; }
const T = window.THREE;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;

/* ================= estado salvo ================= */
const KEY = "tubarao-pet-v1";
const S = { name: "Tubarão", coins: 60, fome: 70, diversao: 70, limpeza: 75, energia: 80, fat: .15, sleeping: false, last: Date.now(), best: 0, eaten: 0 };
try { const raw = localStorage.getItem(KEY); if (raw) Object.assign(S, JSON.parse(raw)); } catch (e) {}
(function offline(){
  const sec = clamp((Date.now() - (S.last || Date.now())) / 1000, 0, 12 * 3600);
  const m = sec / 60 * .5;
  if (S.sleeping) { S.energia += m * 12; S.fome -= m * .6; }
  else { S.energia -= m * .7; S.fome -= m * 1.2; }
  S.diversao -= m * (S.sleeping ? .3 : 1); S.limpeza -= m * .6;
  for (const k of ["fome", "diversao", "limpeza", "energia"]) S[k] = clamp(S[k], 8, 100);
  S.last = Date.now();
})();
let saveT = 0;
function save(){ S.last = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* ================= som ================= */
let actx = null, muted = false;
function audio(){ if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (actx && actx.state === "suspended") actx.resume(); }
function tone(type, f0, f1, dur, vol, delay = 0){
  if (!actx || muted) return;
  const t0 = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + dur);
  o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + dur + .02);
}
const sfx = {
  chomp(){ tone("square", 220, 80, .08, .08); tone("square", 200, 70, .08, .07, .16); },
  giggle(){ [700, 860, 760, 980].forEach((f, i) => tone("triangle", f, f * 1.05, .08, .08, i * .07)); },
  boing(){ tone("sine", 220, 520, .2, .12); },
  bubble(){ tone("sine", rand(500, 900), rand(1100, 1500), .06, .05); },
  water(){ for (let i = 0; i < 10; i++) tone("sine", rand(700, 1300), rand(300, 600), .07, .03, i * .12); },
  coin(){ tone("triangle", 988, 988, .06, .08); tone("triangle", 1319, 1319, .12, .08, .06); },
  hurt(){ tone("sawtooth", 200, 60, .3, .1); },
  no(){ tone("square", 200, 150, .12, .06); tone("square", 150, 110, .14, .06, .13); },
  night(){ [523, 392, 330].forEach((f, i) => tone("sine", f, f, .3, .07, i * .2)); },
  win(){ [523, 659, 784, 1047].forEach((f, i) => tone("triangle", f, f, .16, .09, i * .1)); }
};

/* ================= 3D: cena ================= */
const canvas = $("scene");
let renderer;
try { renderer = new T.WebGLRenderer({ canvas, antialias: true }); }
catch (e) { document.body.innerHTML = '<p class="err">Seu navegador não conseguiu abrir o 3D (WebGL).</p>'; return; }
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
renderer.outputEncoding = T.sRGBEncoding;
renderer.toneMapping = T.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.25;
const scene = new T.Scene();
const camera = new T.PerspectiveCamera(40, 1, .1, 100);
const camState = { d: 7, y: 1.9, ty: .95, dGame: 10 };
const lin = hex => new T.Color(hex).convertSRGBToLinear();

const hemi = new T.HemisphereLight(lin(0xfdfbff), lin(0xc9ae8a), .95); scene.add(hemi);
const sun = new T.DirectionalLight(lin(0xfff3df), 1.05);
sun.position.set(3, 7, 5); sun.castShadow = true;

function mat(c, r = .9, extra = {}){
  const m = new T.MeshStandardMaterial(Object.assign({ color: c, roughness: r, metalness: 0 }, extra));
  m.color.convertSRGBToLinear();
  if (extra.emissive !== undefined) m.emissive.convertSRGBToLinear();
  return m;
}
function canvasTex(size, draw, rx = 1, ry = 1, srgb = true){
  const c = document.createElement("canvas"); c.width = c.height = size;
  draw(c.getContext("2d"), size);
  const t = new T.CanvasTexture(c); t.wrapS = t.wrapT = T.RepeatWrapping; t.repeat.set(rx, ry); t.anisotropy = 4;
  if (srgb) t.encoding = T.sRGBEncoding;
  return t;
}
// textura de pelúcia (felpa): ruído claro usado como cor e relevo
function fleeceTex(rep){
  return canvasTex(256, (g, s) => {
    g.fillStyle = "#f2f2f2"; g.fillRect(0, 0, s, s);
    for (let i = 0; i < 9000; i++) { const v = 200 + Math.random() * 55 | 0; g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(Math.random() * s, Math.random() * s, 1.6, 1.6); }
    g.strokeStyle = "rgba(255,255,255,.35)"; g.lineWidth = 1;
    for (let i = 0; i < 900; i++) { const x = Math.random() * s, y = Math.random() * s, a = Math.random() * 6.28; g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * 3, y + Math.sin(a) * 3); g.stroke(); }
  }, rep, rep);
}
function add(parent, geo, material, pos, opts = {}){
  const m = new T.Mesh(geo, material);
  if (pos) m.position.set(pos[0], pos[1], pos[2]);
  if (opts.rot) m.rotation.set(opts.rot[0], opts.rot[1], opts.rot[2]);
  if (opts.scale) m.scale.set(opts.scale[0], opts.scale[1], opts.scale[2]);
  m.castShadow = opts.cast !== false; m.receiveShadow = !!opts.receive;
  parent.add(m); return m;
}

// caixa com cantos arredondados (móveis com cara de brinquedo)
function RB(w, h, d, r = .08){
  const b = Math.min(r, w / 2 - .002, h / 2 - .002, d / 2 - .002) * .6;
  const sw = w - 2 * b, sh = h - 2 * b, cr = Math.max(.001, Math.min(r, sw / 2, sh / 2) * .9);
  const s = new T.Shape(), x = -sw / 2, y = -sh / 2;
  s.moveTo(x + cr, y); s.lineTo(x + sw - cr, y); s.quadraticCurveTo(x + sw, y, x + sw, y + cr);
  s.lineTo(x + sw, y + sh - cr); s.quadraticCurveTo(x + sw, y + sh, x + sw - cr, y + sh);
  s.lineTo(x + cr, y + sh); s.quadraticCurveTo(x, y + sh, x, y + sh - cr);
  s.lineTo(x, y + cr); s.quadraticCurveTo(x, y, x + cr, y);
  const g = new T.ExtrudeGeometry(s, { depth: Math.max(.002, d - 2 * b), bevelEnabled: true, bevelThickness: b, bevelSize: b, bevelSegments: 3, curveSegments: 6 });
  g.center(); return g;
}

function seaweed(x, z, h, col){
  const g = new T.Group(); g.position.set(x, 0, z); scene.add(g);

  const stems = new T.Group(); stems.position.y = .38; g.add(stems);
  const m = mat(col, .7);
  for (let i = 0; i < 4; i++) {
    const a = i * 1.6 + rand(-.3, .3), hh = h * rand(.7, 1);
    const pts = [];
    for (let k = 0; k <= 6; k++) { const u = k / 6; pts.push(new T.Vector3(Math.cos(a) * .1 + Math.sin(u * 5 + i) * .12 * u, u * hh, Math.sin(a) * .1 + Math.cos(u * 4 + i) * .06 * u)); }
    const tube = new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3(pts), 24, .045, 8, false), m);
    tube.castShadow = true; stems.add(tube);
    for (let k = 1; k <= 3; k++) { const p = pts[k * 2]; add(stems, new T.SphereGeometry(.07, 10, 8), m, [p.x + .06, p.y, p.z], { scale: [1.6, .55, .8], rot: [0, a, .5] }); }
  }
  seaweeds.push({ stems, ph: Math.random() * 6 });
}

  }
}

function surf(E, x, y){
  const dx = (x - E.c.x) / E.r.x, dy = (y - E.c.y) / E.r.y, k = Math.max(0, 1 - dx * dx - dy * dy);
  const z = E.c.z + E.r.z * Math.sqrt(k);
  const n = new T.Vector3((x - E.c.x) / (E.r.x * E.r.x), (y - E.c.y) / (E.r.y * E.r.y), (z - E.c.z) / (E.r.z * E.r.z)).normalize();
  return { p: new T.Vector3(x, y, z), n };
}
function surfMax(x, y){ const a = surf(BODY, x, y), b = surf(BELLY, x, y); return b.p.z > a.p.z ? b : a; }
const Z = new T.Vector3(0, 0, 1);
function stick(obj, s, off = .004){ obj.position.copy(s.p).addScaledVector(s.n, off); obj.quaternion.setFromUnitVectors(Z, s.n); }

const G = { jumpY: 0, jumpV: 0, squash: 0, blinkT: 3, blink: 0, x: PIG_X, z: PIG_Z, tapCD: 0, hopT: 5 };
function pigHop(v = 2.6){ if (G.jumpY <= .001) G.jumpV = v; }
function oink(){ tone("sawtooth", 260, 170, .1, .06); tone("sawtooth", 310, 200, .12, .06, .14); }
function tapPig(){
  if (S.sleeping) { say("Zzz... oinc...", 1.8, "pig"); return; }
  if (G.tapCD > 0) return;
  G.tapCD = 1; pigHop(); oink();
  S.diversao = clamp(S.diversao + 2, 0, 100);
  const lines = ["Oinc!", "Oinc oinc!", "Somos melhores amigos!", "Eu também sou fofinho!", "Bora brincar?"];
  say(lines[(Math.random() * lines.length) | 0], 1.8, "pig");
  if (Math.random() < .5) setTimeout(() => jump(2.4), 260);
  updateUI();
}
function pigTick(dt){
  G.tapCD -= dt;
  const tx = game.active ? Math.min(gameRange() + .3, 3.2) : PIG_X, tz = game.active ? -1.4 : PIG_Z;
  G.x = lerp(G.x, tx, Math.min(1, dt * 3)); G.z = lerp(G.z, tz, Math.min(1, dt * 3));
  if (!S.sleeping && !game.active && (G.hopT -= dt) <= 0) { G.hopT = rand(4, 9); if (Math.random() < .5) pigHop(1.6); }
  if (G.jumpY > 0 || G.jumpV > 0) {
    G.jumpV -= 12 * dt; G.jumpY = Math.max(0, G.jumpY + G.jumpV * dt);
    if (G.jumpY === 0) { G.squash = Math.min(1, -G.jumpV * .12); G.jumpV = 0; }
  }
  G.squash = Math.max(0, G.squash - dt * 4);
  const br = Math.sin(t * (S.sleeping ? 1.3 : 2.8) + 1) * (S.sleeping ? .03 : .02);
  pigSquash.scale.set(1 + G.squash * .15 - br * .5, 1 + br - G.squash * .18, 1 + G.squash * .15);
  pig.position.set(G.x, G.jumpY, G.z);
  pig.rotation.y = lerp(pig.rotation.y, S.sleeping ? -.2 : -.45 + Math.sin(t * .6) * .12, Math.min(1, dt * 3));
  G.blinkT -= dt; if (G.blinkT < 0) { G.blink = .12; G.blinkT = rand(2.5, 5); } G.blink -= dt;
  const open = S.sleeping || G.blink > 0 ? .12 : 1;
  for (const e of pigEyes) e.scale.y = lerp(e.scale.y, open, Math.min(1, dt * 18));
  pigEars.forEach((e, i) => e.rotation.z = (i ? -.45 : .45) + (S.sleeping ? 0 : Math.sin(t * 3 + i) * .08));
  pigTail.rotation.z = Math.sin(t * 6) * (S.sleeping ? .05 : .45);
  const bs = 1 - Math.min(.5, G.jumpY * .3);
  pigBlob.position.set(G.x, .021, G.z); pigBlob.scale.set(bs, bs, 1);
}

function foodMesh(id){
  const g = new T.Group();
  if (id === "sardinha" || id === "fish" || id === "gold") {
    const c = id === "gold" ? 0xffd84a : id === "fish" ? 0xff9a3c : 0xa9c3d3, f = id === "gold" ? 0xd9a40f : id === "fish" ? 0xe0661a : 0x7f9db0;
    add(g, new T.SphereGeometry(.2, 16, 12), mat(c, .5), [0, 0, 0], { scale: [1.5, .8, .6] });
    add(g, new T.ConeGeometry(.14, .22, 12), mat(f, .6), [-.36, 0, 0], { rot: [0, 0, Math.PI / 2], scale: [1, 1, .4] });
    add(g, new T.SphereGeometry(.04, 8, 6), mat(0x10202c, .3), [.18, .05, .1], { cast: false });
  } else if (id === "camarao") {
    add(g, new T.TorusGeometry(.18, .08, 10, 20, Math.PI * 1.3), mat(0xff8a7a, .5), [0, 0, 0], { rot: [0, 0, .4] });
  } else if (id === "lula") {
    add(g, new T.ConeGeometry(.17, .4, 16), mat(0xb47cff, .6), [0, .15, 0]);
    for (let i = 0; i < 5; i++) add(g, new T.CylinderGeometry(.025, .015, .3, 6), mat(0x9a5ff0, .6), [Math.cos(i * 1.25) * .1, -.15, Math.sin(i * 1.25) * .1]);
  } else if (id === "bolo") {
    add(g, new T.CylinderGeometry(.24, .24, .2, 24), mat(0x7cc77a, .7), [0, 0, 0]);
    add(g, new T.CylinderGeometry(.25, .25, .05, 24), mat(0xfff4dc, .6), [0, .12, 0]);
    add(g, new T.SphereGeometry(.06, 12, 8), mat(0xff5d6c, .4), [0, .2, 0]);
  } else if (id === "urchin") {
    add(g, new T.SphereGeometry(.2, 16, 12), mat(0x3b1f4f, .6), [0, 0, 0]);
    const sp = mat(0x5d3a78, .6);
    for (let i = 0; i < 18; i++) {
      const v = new T.Vector3(rand(-1, 1), rand(-1, 1), rand(-1, 1)).normalize();
      const c = add(g, new T.ConeGeometry(.035, .28, 6), sp, [v.x * .26, v.y * .26, v.z * .26]);
      c.quaternion.setFromUnitVectors(new T.Vector3(0, 1, 0), v);
    }
  }
  return g;
}

/* ---------- comer ---------- */
const flying = [];
function feed(id){
  audio();
  const f = FOODS.find(x => x.id === id);
  if (S.sleeping) { say("Zzz... (ele está dormindo)"); return; }
  if (S.coins < f.price) { sfx.no(); toast("Moedas insuficientes. Jogue Pega-peixe para ganhar mais."); return; }
  if (S.fome >= 98) { sfx.no(); say("Não cabe mais nada!"); P.yawT = .6; setTimeout(() => P.yawT = -.6, 220); setTimeout(() => P.yawT = 0, 440); return; }
  S.coins -= f.price;
  const m = foodMesh(id); scene.add(m);
  const btn = document.querySelector(`[data-food="${id}"]`).getBoundingClientRect();
  const ndc = new T.Vector2((btn.left + btn.width / 2) / innerWidth * 2 - 1, -((btn.top) / innerHeight * 2 - 1));
  const ray = new T.Raycaster(); ray.setFromCamera(ndc, camera);
  const start = ray.ray.origin.clone().addScaledVector(ray.ray.direction, 3.5);
  m.position.copy(start);
  flying.push({ m, start, t: 0, f });
  P.mouthT = 1;
  updateUI();
}

  S.diversao = clamp(S.diversao + f.fun, 0, 100);
  S.fat = clamp(S.fat + f.fat + (wasFull ? .03 : 0), 0, 1);
  S.eaten++;
  P.chew = .75; sfx.chomp();
  const lines = wasFull ? ["Tô estufado!", "Ficou mais gordinho!", "Ufa, que barriga!"] : ["Hmm, delícia!", "Nham nham!", "Mais um!", "Que gostoso!"];

  const local = model.worldToLocal(hit.point.clone());

  lastFoam = local.clone();
  if (foam.length > 70) return;
  for (let i = 0; i < 2; i++) {
    const m = new T.Mesh(foamGeo, foamMat); const r = rand(.05, .11);
    m.scale.setScalar(r); m.userData.r = r;
    m.position.copy(local).add(new T.Vector3(rand(-.05, .05), rand(-.05, .05), rand(-.02, .03)));
    m.castShadow = false; model.add(m); foam.push(m);
  }
  S.limpeza = clamp(S.limpeza + .5, 0, 100);
  if (Math.random() < .35) sfx.bubble();
  if (Math.random() < .03) say("Faz cócegas!");
}

/* ---------- dormir ---------- */
let zzzT = 0;
$("lightBtn").addEventListener("click", () => { audio(); S.sleeping ? wake(false) : sleep(); });
function sleep(){ S.sleeping = true; $("lightBtn").textContent = "Acender a luz"; sfx.night(); $("bubble").hidden = true; bubbleT = 0; save(); }
function wake(grumpy){
  S.sleeping = false; $("lightBtn").textContent = "Apagar a luz";
  if (S.energia < 50 && grumpy) say("Ei, eu tava dormindo..."); else say("Bom dia!");
  save();
}

/* ---------- partículas ---------- */
const sparks = [];
const sparkGeo = new T.SphereGeometry(1, 8, 6);
function spark(pos, color, size, vel){
  const m = new T.Mesh(sparkGeo, new T.MeshBasicMaterial({ color: lin(color), transparent: true }));
  m.scale.setScalar(size); m.position.copy(pos); scene.add(m);
  sparks.push({ m, v: vel || new T.Vector3(rand(-1.2, 1.2), rand(.5, 2), rand(-.3, 1)), life: .7, max: .7, g: -5 });
}

/* ================= Pega-peixe ================= */
const game = { active: false, t: 0, score: 0, items: [], spawn: 0, elapsed: 0 };
$("playBtn").addEventListener("click", startGame);
$("goAgain").addEventListener("click", () => { $("gameOver").hidden = true; startGame(); });
$("goExit").addEventListener("click", () => { $("gameOver").hidden = true; });
function startGame(){
  audio();
  if (S.energia < 15) { sfx.no(); say("Tô cansado... me põe pra dormir"); return; }
  if (S.sleeping) wake(false);
  Object.assign(game, { active: true, t: 30, score: 0, spawn: .4, elapsed: 0 });
  game.items.forEach(i => scene.remove(i.m)); game.items = [];
  $("gameHud").hidden = false; $("bottom").hidden = true; $("top").hidden = true; $("bubble").hidden = true; bubbleT = 0;
  P.yawT = 0; P.x = 0; P.xT = 0;
}
function endGame(){
  game.active = false;
  game.items.forEach(i => scene.remove(i.m)); game.items = [];
  $("gameHud").hidden = true; $("bottom").hidden = false; $("top").hidden = false;
  const s = game.score, isBest = s > S.best;
  S.coins += s; S.best = Math.max(S.best, s);
  S.diversao = clamp(S.diversao + 10 + s * 1.5, 0, 100);
  S.energia = clamp(S.energia - 12, 0, 100);
  S.fome = clamp(S.fome - 6, 0, 100);
  S.fat = clamp(S.fat - .02 - s * .002, 0, 1);
  $("goScore").textContent = s;
  $("goText").textContent = (s === 1 ? "peixe pego" : "peixes pegos") + " · +" + s + " moedas" + (isBest && s > 0 ? " · novo recorde!" : "");
  $("gameOver").hidden = false;
  sfx.win(); save(); updateUI();
}
function gameRange(){ const half = Math.tan(T.MathUtils.degToRad(20)) * camera.aspect * (camState.dGame + .3); return Math.max(.8, half - .7); }
function updateGame(dt){
  game.t -= dt; game.elapsed += dt;
  $("gTime").textContent = Math.max(0, Math.ceil(game.t));
  $("gScore").textContent = game.score;
  if (game.t <= 0) { endGame(); return; }
  game.spawn -= dt;
  if (game.spawn <= 0) {
    const r = Math.random(), type = r < .14 + game.elapsed * .004 ? "urchin" : r < .23 ? "gold" : "fish";
    const m = foodMesh(type); const range = gameRange();
    m.position.set(rand(-range, range), 6.2, .4); scene.add(m);
    game.items.push({ m, type, v: 2.1 + game.elapsed * .07 + rand(0, .6), spin: rand(-3, 3) });
    game.spawn = Math.max(.35, .85 - game.elapsed * .015) * rand(.7, 1.2);
  }
  let near = false;
  for (const it of game.items) {
    it.m.position.y -= it.v * dt; it.m.rotation.z += it.spin * dt * .3; it.m.rotation.y += dt * 2;
    const dx = it.m.position.x - pet.position.x, y = it.m.position.y - pet.position.y;
    if (!it.done && y < 2.6 && y > .9 && Math.abs(dx) < .78) {
      it.done = true; scene.remove(it.m);
      if (it.type === "urchin") { P.stun = 1.1; game.score = Math.max(0, game.score - 2); sfx.hurt(); say("Ai! Espinho!", 1.2); }
      else { pigHop(2); game.score += it.type === "gold" ? 3 : 1; P.chew = .3; it.type === "gold" ? sfx.coin() : sfx.chomp(); for (let k = 0; k < 4; k++) spark(it.m.position, it.type === "gold" ? 0xffd84a : 0xffffff, .04); }
    } else if (!it.done && it.type !== "urchin" && y > 2.4 && y < 4 && Math.abs(dx) < 1.2) near = true;
    if (it.m.position.y < -.5) { it.done = true; scene.remove(it.m); }
  }
  game.items = game.items.filter(i => !i.done);
  P.mouthT = near ? .9 : 0;
}

/* ================= toque e arraste ================= */
const ray = new T.Raycaster(), ndc = new T.Vector2();
let down = null;
function setNDC(e){ ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); }
function hitPet(){ ray.setFromCamera(ndc, camera); const h = ray.intersectObjects(pickables, false); return h[0] || null; }
function pointerX(){ ray.setFromCamera(ndc, camera); const t = (0 - ray.ray.origin.z) / ray.ray.direction.z; return ray.ray.origin.x + ray.ray.direction.x * t; }
canvas.addEventListener("pointerdown", e => {
  audio(); setNDC(e);
  if (game.active) { if (P.stun <= 0) P.xT = pointerX(); return; }
  ray.setFromCamera(ndc, camera);
  const hp = ray.intersectObjects(pigPick, false)[0], h = hitPet();
  if (hp && (!h || hp.distance < h.distance)) { down = { x: e.clientX, y: e.clientY, yaw: P.yawT, hit: null, pig: true, moved: false, scrub: false }; return; }
  down = { x: e.clientX, y: e.clientY, yaw: P.yawT, hit: h, moved: false, scrub: room === "banho" && soapOn && !!h && !S.sleeping };
  if (down.scrub) addFoam(h);
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
});
canvas.addEventListener("pointermove", e => {
  setNDC(e);
  if (game.active) { if ((e.buttons || e.pointerType === "mouse") && P.stun <= 0) P.xT = pointerX(); return; }
  if (!down) return;
  if (Math.hypot(e.clientX - down.x, e.clientY - down.y) > 8) down.moved = true;
  if (down.scrub) { const h = hitPet(); if (h) addFoam(h); }
  else if (down.moved) P.yawT = clamp(down.yaw + (e.clientX - down.x) * .012, -2.6, 2.6);
});
function up(){
  if (down && !down.moved && down.pig) tapPig();
  else if (down && !down.moved && down.hit && !down.scrub) tapPet(down.hit);
  down = null; lastFoam = null;
}
canvas.addEventListener("pointerup", up); canvas.addEventListener("pointercancel", up);
function tapPet(hit){
  if (S.sleeping) { if (Math.random() < .5) say("Zzz... ronc..."); else { wake(true); } return; }
  if (P.tapCD > 0) return;
  P.tapCD = 1.2; jump(); sfx.giggle();
  const onBelly = hit.object === belly;
  S.diversao = clamp(S.diversao + 2, 0, 100);
  const lines = onBelly ? ["Cócegas na barriga!", "Hihihi!", "Para, para!"] : ["Oi!", "Hehe!", "Me dá um peixinho?", "Bora brincar?"];
  say(lines[(Math.random() * lines.length) | 0], 1.8);
  if (Math.random() < .4) setTimeout(() => { pigHop(); oink(); }, 320);
  updateUI();
}

/* ================= nome ================= */
$("nameBtn").addEventListener("click", () => { const i = $("nameInput"); i.value = S.name; $("nameBtn").hidden = true; i.hidden = false; i.focus(); i.select(); });
function saveName(){ const i = $("nameInput"); const v = i.value.trim(); if (v) S.name = v.slice(0, 16); i.hidden = true; $("nameBtn").hidden = false; save(); updateUI(); }
$("nameInput").addEventListener("keydown", e => { if (e.key === "Enter") saveName(); if (e.key === "Escape") { $("nameInput").value = S.name; saveName(); } });
$("nameInput").addEventListener("blur", saveName);
$("muteBtn").addEventListener("click", () => { muted = !muted; $("muteBtn").innerHTML = `<svg><use href="#i-${muted ? "mudo" : "som"}"/></svg>`; $("muteBtn").setAttribute("aria-label", muted ? "Ligar o som" : "Desligar o som"); });

/* ================= ícone na tela inicial ================= */
let installEvt = null;
addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; $("installBtn").hidden = false; });
$("installBtn").addEventListener("click", async () => {
  if (!installEvt) return;
  installEvt.prompt();
  try { await installEvt.userChoice; } catch (err) {}
  installEvt = null; $("installBtn").hidden = true;
});
addEventListener("appinstalled", () => { $("installBtn").hidden = true; toast("Ícone adicionado à tela inicial!"); });

/* ================= tamanho da tela ================= */
function resize(){
  const W = innerWidth, H = innerHeight;
  renderer.setSize(W, H, false);
  camera.aspect = W / H; camera.updateProjectionMatrix();
  const tan = Math.tan(T.MathUtils.degToRad(20));
  camState.d = clamp(Math.max(2.9 / (.62 * 2 * tan), 1.85 / (tan * camera.aspect)), 5.5, 11);
  camState.dGame = clamp(Math.max(camState.d + 1.5, 2.6 / (tan * camera.aspect)), 7, 15);
}
addEventListener("resize", resize); resize();

/* ================= laço principal ================= */
let last = performance.now(), t = 0, hintT = 6, nightK = S.sleeping ? 1 : 0;
setRoom(S.sleeping ? "quarto" : "cozinha");
if (S.sleeping) $("lightBtn").textContent = "Acender a luz";
updateUI();
const tmpV = new T.Vector3();

function tickNeeds(dt){
  const m = dt / 60;
  if (S.sleeping) { S.energia += m * 12; S.fome -= m * .6; S.diversao -= m * .3; }
  else { S.energia -= m * .7; S.fome -= m * 1.2; S.diversao -= m * 1; }
  S.limpeza -= m * .6;
  S.fat = clamp(S.fat - m * .002, 0, 1);
  for (const k of NEEDS) S[k] = clamp(S[k], 0, 100);
  if (S.sleeping && S.energia >= 100 && Math.random() < dt * .1) say("Energia cheia! Pode acender a luz", 3);
}

function loop(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now; t += dt;
  tickNeeds(dt);
  if ((saveT -= dt) <= 0) { saveT = 4; save(); }
  if ((uiT -= dt) <= 0) { uiT = .5; updateUI(); }

  // dicas do bichinho
  hintT -= dt;
  if (hintT <= 0 && !game.active && bubbleT <= 0 && !S.sleeping) {
    hintT = 14;
    const low = [["fome", "Tô com fome!"], ["energia", "Tô com sono..."], ["limpeza", "Tô fedendo..."], ["diversao", "Bora brincar?"]].filter(([k]) => S[k] < 30);
    if (low.length) say(low[0][1], 3);
    else if (S.fat > .8) say("Acho que comi demais...", 3);
  }

  decorTick(dt, t);
  pigTick(dt);

  // corpo: respiração, gordura, pulo, amassadinho
  const sleepy = S.energia < 20;
  P.tapCD -= dt;
  if (P.jumpY > 0 || P.jumpV > 0) {
    P.jumpV -= 12 * dt; P.jumpY = Math.max(0, P.jumpY + P.jumpV * dt);
    if (P.jumpY === 0) { P.squash = Math.min(1, -P.jumpV * .12); P.jumpV = 0; }
  }
  P.squash = Math.max(0, P.squash - dt * 4);
  const fx = 1 + S.fat * .42;
  const br = Math.sin(t * (S.sleeping ? 1.4 : 2.4)) * (S.sleeping ? .03 : .015);
  squashG.scale.set(fx * (1 + P.squash * .14 - br * .5), 1 + br - P.squash * .16, fx * (1 + P.squash * .14));
  P.yaw = lerp(P.yaw, P.yawT, Math.min(1, dt * 8));
  if (!down) P.yawT = lerp(P.yawT, 0, Math.min(1, dt * 1.2));
  pet.rotation.y = P.yaw + (S.sleeping ? 0 : Math.sin(t * .7) * .05);
  pet.position.y = P.jumpY;

  // jogo: tubarão anda para os lados
  if (game.active) {
    P.stun = Math.max(0, P.stun - dt);
    const range = gameRange();
    P.xT = clamp(P.xT, -range, range);
    if (P.stun <= 0) P.x = lerp(P.x, P.xT, Math.min(1, dt * 10));
    pet.rotation.z = P.stun > 0 ? Math.sin(t * 20) * .12 : clamp((P.xT - P.x) * -.15, -.2, .2);
    updateGame(dt);
  } else { P.x = lerp(P.x, HOME_X, Math.min(1, dt * 4)); pet.rotation.z = lerp(pet.rotation.z, 0, Math.min(1, dt * 6)); }
  pet.position.x = P.x;
  const bs = (1 + S.fat * .42) * (1 - Math.min(.5, P.jumpY * .25));
  blob.position.x = P.x; blob.scale.set(bs, bs, 1); blob.material.opacity = 1 - Math.min(.6, P.jumpY * .4);

  // barbatanas e cauda
  const flap = S.sleeping ? .05 : (game.active ? .5 : .18);
  finL.rotation.z = -Math.sin(t * 5) * flap - .1; finR.rotation.z = Math.sin(t * 5) * flap + .1;
  tail.rotation.y = Math.sin(t * 4) * .25;

  // olhos: piscar, sono, seguir o dedo
  P.blinkT -= dt;
  if (P.blinkT < 0) { P.blink = .13; P.blinkT = rand(2, 5); }
  P.blink -= dt;
  let open = S.sleeping ? .07 : sleepy ? .5 : 1;
  if (P.blink > 0) open = .08;
  const sad = !S.sleeping && (avgMood() < 35 || Math.min(S.fome, S.diversao, S.limpeza, S.energia) < 12);
  P.lookX = lerp(P.lookX, clamp(ndc.x - Math.sin(P.yaw) * .5, -1, 1) * .04, .15);
  P.lookY = lerp(P.lookY, clamp(ndc.y - .1, -1, 1) * .035, .15);
  for (const e of eyes) {
    e.g.scale.y = lerp(e.g.scale.y, open, Math.min(1, dt * 18));
    if (P.stun > 0) e.pupil.position.set(Math.cos(t * 14 + e.side) * .035, Math.sin(t * 14 + e.side) * .035, .045);
    else e.pupil.position.set(P.lookX, P.lookY, .045);
    e.brow.visible = sad || P.stun > 0;
    e.brow.rotation.z = e.side * -.35;
  }

  // boca
  if (P.chew > 0) { P.chew -= dt; P.mouth = Math.sin(P.chew * 26) > 0 ? .85 : .1; }
  else P.mouth = lerp(P.mouth, P.mouthT, Math.min(1, dt * 12));
  if (!game.active && flying.length === 0) P.mouthT = 0;
  mouthIn.visible = P.mouth > .04;
  mouthIn.scale.set(.4, .04 + P.mouth * .13, 1);
  mouthIn.position.copy(surf(BELLY, 0, .17 - P.mouth * .06).p).z += .004;
  jaw.position.set(0, -P.mouth * .13, P.mouth * .03);

  // comida voando até a boca
  for (let i = flying.length - 1; i >= 0; i--) {
    const fl = flying[i]; fl.t += dt / .6;
    const end = mouthWorld(), k = Math.min(1, fl.t);
    tmpV.lerpVectors(fl.start, end, k); tmpV.y += Math.sin(k * Math.PI) * .9;
    fl.m.position.copy(tmpV); fl.m.rotation.y += dt * 6; fl.m.rotation.z += dt * 3;
    fl.m.scale.setScalar(1 - Math.max(0, k - .85) * 4);
    if (k >= 1) { scene.remove(fl.m); flying.splice(i, 1); eatDone(fl.f); }
  }

  // sujeira
  const dirt = S.limpeza < 70 ? Math.ceil((70 - S.limpeza) / 7) : 0;
  spots.forEach((s, i) => s.visible = i < dirt);

  // chuveiro
  if (showerT > 0) {
    showerT -= dt;
    const head = new T.Vector3(P.x, 3.9, 0);
    for (let k = 0; k < 4; k++) {
      const m = new T.Mesh(sparkGeo, new T.MeshBasicMaterial({ color: lin(0x9fe3f5), transparent: true, opacity: .85 }));
      m.scale.set(.025, .09, .025); m.position.set(head.x + rand(-.38, .38), head.y, head.z + rand(-.38, .38)); scene.add(m);
      sparks.push({ m, v: new T.Vector3(rand(-.4, .4), -7, rand(-.2, .4)), life: .9, max: .9, g: -6, water: true });
    }
    for (const f of foam) f.scale.multiplyScalar(1 - dt * 1.6);
    if (showerT < 1) { for (const f of foam) model.remove(f); foam.length = 0; }
  }
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i]; s.life -= dt; s.v.y += s.g * dt; s.m.position.addScaledVector(s.v, dt);
    s.m.material.opacity = Math.max(0, s.life / s.max);
    if (s.life <= 0 || (s.water && s.m.position.y < .02)) { scene.remove(s.m); s.m.material.dispose(); sparks.splice(i, 1); }
  }

  // luz do dia / noite
  nightK = lerp(nightK, S.sleeping ? 1 : 0, Math.min(1, dt * 2.5));
  hemi.intensity = lerp(.78, .12, nightK); sun.intensity = lerp(.72, .04, nightK);
  moon.intensity = nightK * .35;
  lamp.intensity = room === "quarto" ? lerp(.9, 0, nightK) : 0;
  const shade = props.quarto.getObjectByName("shade"); if (shade) shade.material.emissiveIntensity = lerp(.7, 0, nightK);
  if (S.sleeping && (zzzT -= dt) <= 0) { zzzT = 1.3; zzz(); }

  // câmera
  const d = game.active ? camState.dGame : camState.d;
  camera.position.x = lerp(camera.position.x, game.active ? 0 : CAM_X, Math.min(1, dt * 3));
  camera.position.y = lerp(camera.position.y, game.active ? 2.6 : camState.y, Math.min(1, dt * 3));
  camera.position.z = lerp(camera.position.z || d, d, Math.min(1, dt * 3));
  camera.lookAt(camera.position.x, game.active ? 1.9 : camState.ty, 0);

  renderer.render(scene, camera);

  // balão de fala acima da cabeça
  if (bubbleT > 0) {
    bubbleT -= dt;
    const p = (bubbleWho === "pig" ? pigModel.localToWorld(new T.Vector3(0, .9, 0)) : model.localToWorld(new T.Vector3(0, 1.55, 0))).project(camera);
    const b = $("bubble");
    b.style.left = clamp((p.x + 1) / 2 * innerWidth, 90, innerWidth - 90) + "px";
    b.style.top = Math.max(150, (1 - p.y) / 2 * innerHeight) + "px";
    if (bubbleT <= 0) b.hidden = true;
  }
  requestAnimationFrame(loop);
}
function zzz(){
  const p = model.localToWorld(new T.Vector3(.4, 1.3, 0)).project(camera);
  const el = document.createElement("div"); el.className = "zzz"; el.textContent = "Z";
  el.style.left = (p.x + 1) / 2 * innerWidth + "px"; el.style.top = (1 - p.y) / 2 * innerHeight + "px";
  el.style.fontSize = rand(1.1, 1.8) + "rem";
  document.body.appendChild(el); setTimeout(() => el.remove(), 2500);
}
document.addEventListener("visibilitychange", () => { if (document.hidden) save(); else last = performance.now(); });
addEventListener("pagehide", save);
camera.position.set(0, camState.y, camState.d);
say(S.sleeping ? "Zzz..." : "Oi! Eu sou o " + S.name + "!", 3);
if (!S.sleeping) setTimeout(() => { pigHop(); oink(); say("E eu sou o amigo dele! Oinc!", 2.8, "pig"); }, 3400);
requestAnimationFrame(loop);
})();
</script>
